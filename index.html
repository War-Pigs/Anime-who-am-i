<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Guess Who I Am</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<header class="top">
  <a class="logo" href="#" id="logo"><span class="q">?</span> Anime Guess Who I Am</a>
  <div class="topRight">
    <span id="modeTag" class="mode"></span>
    <div id="langs" class="langs" role="group" aria-label="Language"></div>
  </div>
</header>

<main>
  <section id="vHome">
    <div class="hero">
      <div class="heroTxt">
        <h1 data-i18n-html="heroTitle"></h1>
        <p data-i18n="heroText"></p>
        <label class="fld"><span data-i18n="yourName"></span>
          <input id="nameIn" maxlength="12" data-i18n-ph="namePh" autocomplete="off">
        </label>
      </div>
      <div class="heroArt"><img src="img/yes.webp" alt=""></div>
    </div>

    <div class="lobby">
      <div class="lobbyHead">
        <h2 data-i18n="openRooms"></h2>
        <button id="createBtn" class="btn primary" data-i18n="createRoom"></button>
      </div>
      <form id="searchForm" class="searchRow">
        <input id="search" data-i18n-ph="searchPh" autocomplete="off">
        <button class="btn" data-i18n="joinByCode"></button>
      </form>
      <div id="roomList" class="roomList"></div>
    </div>
  </section>

  <section id="vRoom" hidden>
    <div class="roomBar">
      <div class="rbMain">
        <h2 id="rName"></h2>
        <div class="rbMeta"><button id="codeChip" class="chip" data-i18n-title="copyCode"></button><span id="rSet"></span></div>
        <details id="poolBox" class="poolBox" hidden><summary id="poolSum"></summary><ul id="poolList"></ul></details>
      </div>
      <button id="leaveBtn" class="btn ghost" data-i18n="leave"></button>
    </div>

    <div id="lobbyPane" class="lobbyPane">
      <div id="lobbyStage" class="stage small"></div>
      <div class="lpSide">
        <h3><span data-i18n="players"></span> <span id="pCount"></span></h3>
        <ul id="pList" class="pList"></ul>
        <button id="startBtn" class="btn primary big" data-i18n="start"></button>
        <p id="startNote" class="note"></p>
        <button id="settingsBtn" class="btn ghost wide" data-i18n="settings" hidden></button>
      </div>
    </div>

    <div id="gamePane" class="gamePane" hidden>
      <div class="playCol">
        <div id="turnBanner" class="turnBanner"></div>
        <div id="stage" class="stage"></div>
        <div class="actions">
          <div class="reacts">
            <button class="rx yes" data-rx="yes" data-i18n-aria="yes">✓<span data-i18n="yes"></span></button>
            <button class="rx no" data-rx="no" data-i18n-aria="no">✗<span data-i18n="no"></span></button>
            <button class="rx maybe" data-rx="maybe" data-i18n-aria="maybe">?<span data-i18n="maybe"></span></button>
          </div>
          <div class="turnBtns">
            <button id="guessBtn" class="btn primary" data-i18n="guess"></button>
            <button id="endTurnBtn" class="btn"></button>
            <button id="endGameBtn" class="btn ghost" data-i18n="endGame" hidden></button>
          </div>
        </div>
      </div>
      <aside class="chat">
        <div id="chatLog" class="chatLog" aria-live="polite"></div>
        <form id="chatForm" class="chatForm">
          <input id="chatIn" maxlength="120" data-i18n-ph="chatPh" autocomplete="off">
          <button class="btn primary" data-i18n="send"></button>
        </form>
      </aside>
    </div>
  </section>
</main>

<dialog id="dlgCreate">
  <form id="createForm" method="dialog" class="dlg">
    <h3 id="cTitle"></h3>
    <div id="cRoomOnly" class="stackGap">
      <label class="fld"><span data-i18n="roomName"></span><input id="cName" maxlength="20" data-i18n-ph="roomNamePh"></label>
      <fieldset class="seg">
        <legend data-i18n="visibility"></legend>
        <label><input type="radio" name="vis" value="open" checked><span data-i18n="visOpen"></span></label>
        <label><input type="radio" name="vis" value="lock"><span data-i18n="visLock"></span></label>
        <label><input type="radio" name="vis" value="hidden"><span data-i18n="visHidden"></span></label>
      </fieldset>
      <label class="fld" id="cPassWrap" hidden><span data-i18n="roomPass"></span><input id="cPass" maxlength="20" data-i18n-ph="roomPassPh"></label>
    </div>
    <fieldset class="seg">
      <legend data-i18n="pool"></legend>
      <label><input type="radio" name="pmode" value="top" checked><span data-i18n="poolTop"></span></label>
      <label><input type="radio" name="pmode" value="pick"><span data-i18n="poolPick"></span></label>
    </fieldset>
    <div id="cTopWrap" class="stackGap">
      <fieldset class="seg">
        <label><input type="radio" name="rng" value="1-50" checked><span>Top 1–50</span></label>
        <label><input type="radio" name="rng" value="1-500"><span>Top 1–500</span></label>
        <label><input type="radio" name="rng" value="1-1000"><span>Top 1–1000</span></label>
        <label><input type="radio" name="rng" value="custom"><span data-i18n="topCustom"></span></label>
      </fieldset>
      <div class="two" id="cCustom" hidden>
        <label class="fld"><span data-i18n="fromRank"></span><input id="cFrom" type="number" min="1" max="5000" value="1"></label>
        <label class="fld"><span data-i18n="toRank"></span><input id="cTo" type="number" min="1" max="5000" value="200"></label>
      </div>
    </div>
    <div id="cPickWrap" class="pickWrap" hidden>
      <div class="pickHead"><span id="pickCount"></span><button type="button" id="pickClear" class="linkBtn" data-i18n="pickClear"></button></div>
      <div id="pickChips" class="chips"></div>
      <input id="pickSearch" data-i18n-ph="pickSearchPh" autocomplete="off">
      <div id="pickList" class="pickList"></div>
    </div>
    <div class="two">
      <label class="fld"><span data-i18n="maxPlayers"></span>
        <select id="cMax"><option>2</option><option>3</option><option>4</option><option selected>6</option><option>8</option></select>
      </label>
      <label class="fld"><span data-i18n="chars"></span>
        <select id="cRole"><option value="main" data-i18n="mainOnly"></option><option value="all" data-i18n="mainAll"></option></select>
      </label>
    </div>
    <p id="cPoolNote" class="note"></p>
    <p id="cErr" class="err"></p>
    <div class="dlgBtns"><button type="button" class="btn ghost" data-close data-i18n="cancel"></button><button id="cSubmit" class="btn primary"></button></div>
  </form>
</dialog>

<dialog id="dlgPass">
  <form id="passForm" method="dialog" class="dlg">
    <h3 data-i18n="passTitle"></h3>
    <label class="fld"><span data-i18n="password"></span><input id="passIn" maxlength="20" autocomplete="off"></label>
    <p id="passErr" class="err"></p>
    <div class="dlgBtns"><button type="button" class="btn ghost" data-close data-i18n="cancel"></button><button class="btn primary" data-i18n="enter"></button></div>
  </form>
</dialog>

<dialog id="dlgGuess">
  <form id="guessForm" method="dialog" class="dlg">
    <h3 data-i18n="guessTitle"></h3>
    <label class="fld"><span data-i18n="guessLabel"></span><input id="guessIn" maxlength="60" autocomplete="off" data-i18n-ph="guessPh"></label>
    <div id="sugg" class="sugg"></div>
    <p class="note" data-i18n="guessNote"></p>
    <p id="guessErr" class="err"></p>
    <div class="dlgBtns"><button type="button" class="btn ghost" data-close data-i18n="cancel"></button><button class="btn primary" data-i18n="confirm"></button></div>
  </form>
</dialog>

<dialog id="dlgResult">
  <div class="dlg wide">
    <h3 data-i18n="results"></h3>
    <ol id="resultList" class="resultList"></ol>
    <div class="dlgBtns"><button id="againBtn" class="btn primary" data-i18n="again"></button><button type="button" class="btn ghost" data-close data-i18n="keepViewing"></button></div>
  </div>
</dialog>

<div id="toast" class="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
