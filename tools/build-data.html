<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build anime.json</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff3f7,#191329);--panel:light-dark(#fff,#251c3d);--ink:light-dark(#33265c,#f3ecff);--soft:light-dark(#7a6a9e,#b9acd9);--line:light-dark(#f0dbe6,#3a2e5a);--pink:#ff6f9f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Mitr,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 18px}
h1{font-size:30px;line-height:1.15;margin:0 0 8px;font-weight:600}
.box{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}
label{display:grid;gap:4px;font-size:14px;color:var(--soft)}
select{font:inherit;color:var(--ink);min-height:44px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--panel)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:14px}
button,a.btn{font:inherit;font-weight:500;min-height:46px;padding:8px 20px;border-radius:12px;border:2px solid var(--pink);background:var(--pink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden;margin:16px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .3s}
#log{font-size:14px;color:var(--soft);max-height:220px;overflow:auto;white-space:pre-wrap;margin:8px 0 0}
.ok{color:#2fb877;font-weight:500}.bad{color:#e5566b;font-weight:500}
ol{padding-left:22px}
.top{display:flex;justify-content:flex-end}.langs{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}.langs button{border:0;background:none;min-height:36px;padding:2px 10px;font:inherit;font-size:14px;color:var(--soft);cursor:pointer}.langs button[aria-pressed=true]{background:var(--pink);color:#fff}
html[lang=ja] body{font-family:"M PLUS Rounded 1c",Mitr,system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <div class="top"><div id="langs" class="langs"></div></div>
  <h1 data-i18n="b_title"></h1>
  <p data-i18n-html="b_intro"></p>

  <div class="box">
    <div class="row">
      <label><span data-i18n="b_count"></span>
        <select id="count"><option value="3000">Top 1–3000</option><option value="2000">Top 1–2000</option><option value="1000" selected>Top 1–1000</option><option value="500">Top 1–500</option><option value="200">Top 1–200</option></select>
      </label>
      <button id="go" data-i18n="b_go"></button>
      <a id="dl" class="btn" hidden data-i18n="b_dl"></a>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div id="status" data-i18n="b_idle"></div>
    <pre id="log"></pre>
  </div>

  <div class="box">
    <b data-i18n="b_next"></b>
    <ol><li data-i18n-html="b_s1"></li><li data-i18n-html="b_s2"></li><li data-i18n-html="b_s3"></li><li data-i18n-html="b_s4"></li></ol>
  </div>
</main>
<script type="module">
import { t, applyI18n, mountLangButtons, onLang } from '../js/i18n.js?v=11';
mountLangButtons(document.querySelector('#langs')); applyI18n();
let doneMsg = null; document.title = t('b_title');
onLang(() => { document.title = t('b_title'); if (doneMsg) document.querySelector('#status').innerHTML = `<span class="ok">${t('b_done', doneMsg)}</span>`; });
{
const API = 'https://graphql.anilist.co';
const CF = `edges{role node{id name{full alternative} image{large}}}`;
// AniList refuses page*perPage beyond 5000, so past that we restart at page 1 with a
// popularity cursor (popularity_lesser) and keep going: no depth limit, duplicates skipped by id.
const Q = cursor => `query($page:Int,$per:Int${cursor ? ',$pl:Int' : ''}){Page(page:$page,perPage:$per){pageInfo{hasNextPage}
 media(type:ANIME,sort:POPULARITY_DESC,isAdult:false${cursor ? ',popularity_lesser:$pl' : ''}){id idMal popularity title{romaji english}
 c1:characters(page:1,perPage:25,sort:[ROLE,FAVOURITES_DESC]){${CF}}
 c2:characters(page:2,perPage:25,sort:[ROLE,FAVOURITES_DESC]){${CF}}}}}`;
const DEPTH = 5000;
const IP = 'https://s4.anilist.co/file/anilistcdn/character/large/';
const MAX_CHARS = 50;
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const log = (m, cls) => { const d = document.createElement('div'); d.textContent = m; if (cls) d.className = cls; $('#log').prepend(d); };
let gap = 2200, last = 0;

async function gql(vars) {
  for (let attempt = 0; attempt < 8; attempt++) {
    const w = last + gap - Date.now(); if (w > 0) await sleep(w);
    last = Date.now();
    let res;
    try {
      res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ query: Q(vars.pl != null), variables: vars }) });
    } catch (e) { log(t('b_conn')); await sleep(3000 * (attempt + 1)); continue; }
    if (res.status === 429) {
      const ra = +res.headers.get('Retry-After') || 60;
      $('#status').textContent = t('b_wait', { s: ra });
      gap = Math.min(gap + 500, 4000);
      await sleep(ra * 1000 + 500); continue;
    }
    const j = await res.json().catch(() => null);
    if (j && j.data && j.data.Page) return j.data.Page;
    const msg = j?.errors?.map(e => e.message).join(', ') || ('HTTP ' + res.status);
    if (/complex/i.test(msg)) throw Object.assign(new Error(msg), { complexity: true });
    if (/depth/i.test(msg)) throw Object.assign(new Error(msg), { depth: true });
    if (res.status >= 400 && res.status < 500) throw new Error(msg);   // a bad request won't fix itself by retrying
    log(t('b_err', { m: msg })); await sleep(3000 * (attempt + 1));
  }
  throw new Error(t('b_noreply'));
}

function offer(anime) {
  const data = { v: 2, source: 'AniList', sort: 'POPULARITY_DESC', built: new Date().toISOString().slice(0, 10), ip: IP, anime };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = $('#dl'); if (a.href) URL.revokeObjectURL(a.href);
  a.href = URL.createObjectURL(blob); a.download = 'anime.json'; a.hidden = false; a.textContent = t('b_dl');
  return blob;
}
$('#go').addEventListener('click', async () => {
  const want = +$('#count').value;
  $('#go').disabled = true; $('#dl').hidden = true; $('#log').textContent = ''; doneMsg = null;
  const anime = [], seenChar = new Set(), seenAnime = new Set();
  let page = 1, per = 50, skipped = 0, pl = null, lastPop = null, jumpedAt = null;
  const jump = () => {   // restart below the last popularity seen
    if (lastPop == null) throw new Error('page depth');
    pl = jumpedAt === lastPop ? lastPop : lastPop + 1;   // +1 keeps ties; if stuck on a tie, step past it
    jumpedAt = lastPop; page = 1;
    log(t('b_jump', { p: lastPop }));
  };
  try {
    while (anime.length < want) {
      if (page * per > DEPTH) jump();
      $('#status').textContent = t('b_page', { p: page, n: anime.length, w: want });
      let P;
      try { P = await gql(pl == null ? { page, per } : { page, per, pl }); }
      catch (e) {
        if (e.complexity && per > 10) { const first = (page - 1) * per; per = Math.floor(per / 2); page = Math.floor(first / per) + 1; log(t('b_shrink', { n: per })); continue; }
        if (e.depth) { jump(); continue; }
        throw e;
      }
      const list = P.media || [];
      if (list.length) lastPop = list[list.length - 1].popularity ?? lastPop;
      for (const m of list) {
        if (anime.length >= want) break;
        if (seenAnime.has(m.id)) continue;
        seenAnime.add(m.id);
        const cast = [];
        const seenHere = new Set();
        for (const e of [...(m.c1?.edges || []), ...(m.c2?.edges || [])]) {
          const n = e.node; if (!n?.id || seenHere.has(n.id) || cast.length >= MAX_CHARS) continue;
          let img = n.image?.large || '';
          if (!img || /default\.jpg/.test(img)) continue;
          seenHere.add(n.id);
          if (img.startsWith(IP)) img = img.slice(IP.length);
          const alt = (n.name?.alternative || []).filter(Boolean).slice(0, 2);
          const row = [n.id, n.name?.full || '', img, e.role === 'MAIN' ? 1 : 0];
          if (alt.length) row.push(alt);
          cast.push(row);
        }
        cast.sort((x, y) => y[3] - x[3]);
        const main = cast.filter(c => c[3]);
        if (!main.length) { skipped++; continue; }
        // Skip sequels/spin-offs whose main cast is already in the list (e.g. "Season 2").
        const repeat = main.filter(c => seenChar.has(c[0])).length;
        if (repeat / main.length >= 0.5) { skipped++; continue; }
        cast.forEach(c => seenChar.add(c[0]));
        const title = m.title?.english || m.title?.romaji || '?', r = m.title?.romaji && m.title.romaji !== title ? m.title.romaji : undefined;
        anime.push({ id: m.id, mal: m.idMal || null, t: title, r, c: cast });
      }
      $('#bar').style.width = Math.round(anime.length / want * 100) + '%';
      log(t('b_log', { p: page, n: anime.length, s: skipped }));
      if (!P.pageInfo?.hasNextPage) break;
      page++;
    }
    const blob = offer(anime);
    const chars = anime.reduce((s, a) => s + a.c.length, 0);
    doneMsg = { n: anime.length, c: chars, mb: (blob.size / 1048576).toFixed(1) };
    $('#status').innerHTML = `<span class="ok">${t('b_done', doneMsg)}</span>`;
    $('#bar').style.width = '100%';
  } catch (e) {
    $('#status').innerHTML = ''; const s = document.createElement('span'); s.className = 'bad';
    // Keep what was already fetched: a long 3000-anime run should not be lost to one late failure.
    if (anime.length) { offer(anime); $('#dl').textContent = t('b_dlPart', { n: anime.length }); s.textContent = t('b_partial', { m: e.message, n: anime.length }); }
    else s.textContent = e.message;
    $('#status').append(s);
  }
  $('#go').disabled = false;
});
}
</script>
</body>
</html>
